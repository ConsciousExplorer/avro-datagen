name: CI

on:
  pull_request:
    branches: [main]
    # `edited` so retitling a PR re-runs the title check.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  # PRs are squash-merged with the PR title as the commit subject, and
  # release-please builds the changelog from those subjects. A non-conventional
  # title would silently drop the change from the next release's notes, so it
  # fails here instead.
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must stay in step with changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            refactor
            revert
            deps
            docs
            style
            test
            build
            ci
            chore
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" should start with a lowercase character
            (it becomes a changelog line verbatim).

  check:
    uses: ./.github/workflows/checks.yml
